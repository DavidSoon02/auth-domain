name: Pipeline for Login Service

on:
  push:
    branches:
      - test
    paths:
      - 'login-service/**'
      - '.github/workflows/login-service-pipeline.yml'
  pull_request:
    branches: 
      - test
    paths:
      - 'login-service/**'
      - '.github/workflows/login-service-pipeline.yml'

jobs:
  build-and-push-docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Log in to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image
        run: docker buildx build -t ${{ secrets.DOCKER_USERNAME }}/${{ secrets.DOCKER_IMAGE_LOGIN }}:latest ./login-service

      - name: Push Docker image to Dockerhub
        run: docker push ${{ secrets.DOCKER_USERNAME }}/${{ secrets.DOCKER_IMAGE_LOGIN }}:latest

  deploy-to-ec2-instance:
    needs: build-and-push-docker
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.EC2_HOST_TEST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_PRIVATE_KEY }}
          script: |
            echo "Pull, stop, and redeploy the Docker container"
            docker pull ${{ secrets.DOCKER_USERNAME }}/${{ secrets.DOCKER_IMAGE_LOGIN }}:latest
            docker stop ${{ secrets.DOCKER_IMAGE_LOGIN }} || true
            docker rm ${{ secrets.DOCKER_IMAGE_LOGIN }} || true
            docker run --restart always \
                       -e DB_HOST=${{ secrets.DB_HOST }} \
                       -e DB_PORT=${{ secrets.DB_PORT }} \
                       -e DB_NAME=${{ secrets.DB_NAME }} \
                       -e DB_USER=${{ secrets.DB_USER }} \
                       -e DB_PASSWORD=${{ secrets.DB_PASSWORD }} \
                       -e DB_SSL=${{ secrets.DB_SSL }} \
                       -e JWT_SECRET=${{ secrets.JWT_SECRET }} \
                       -e JWT_EXPIRES_IN=${{ secrets.JWT_EXPIRES_IN }} \
                       -e BCRYPT_ROUNDS=${{ secrets.BCRYPT_ROUNDS }} \
                       -e NODE_ENV=production \
                       -d --name ${{ secrets.DOCKER_IMAGE_LOGIN }} \
                       -p 3001:3001 ${{ secrets.DOCKER_USERNAME }}/${{ secrets.DOCKER_IMAGE_LOGIN }}:latest
